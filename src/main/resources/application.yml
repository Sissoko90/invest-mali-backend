spring:
  application:
    name: AKERA
  profiles:
    active: dev  # <-- profil actif en local (using MySQL database)
  jackson:
    time-zone: Africa/Bamako
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    org.hibernate.SQL: off
    org.springframework.web: info

# Configuration API INSTAT Mali
instat:
  api:
    base-url: https://apimali.test.instat.ml/api
    bearer-token: MTI1OTEyNjkxNDQ5MTIzOTE0NDkxMDc5MTA2OTEzMDkxMTY5MTA0OTEzMjkxMjY5MTI2OTE1NTkxMjI5MTI0OTEzMjkxMDU5MTQ0OTEwNzkxMjc5MTA1OTY1OTEwNTkxMTU5MTA0OTYw
    timeout: 30000
    enabled: true

# Configuration RCCM
rccm:
  api:
    base-url: http://10.92.2.10:8080/RCCM-OHADA/webServTiers/save
    username: ${RCCM_USERNAME:apiml}
    password: ${RCCM_PASSWORD:apiml223}
    ident-tiers: APIML
    noeud: ML-BKO-01
    timeout: 30000

app:
  contact:
    email: ${APP_CONTACT_EMAIL:abdaty11@gmail.com}
  rate-limit:
    capacity: 10000  # Augmenter pour le développement
    refill-tokens: 5000  # Augmenter pour le développement
    refill-period-seconds: 60
  security:
    jwt:
      secret: ${security.jwt.secret}
      expiration-ms: 3600000
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: when_authorized

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:bXlkZXZzZWNyZXRsb25nc2VjcmV0YmFzZTY0dmFsaWRrZXk=}

# Configuration TresorPay (remplace Stripe et autres moyens de paiement)
tresorpay:
  base-url: https://tresorpay.ml/api/public/v1
  auth-url: https://auth.finances.ml/realms/tresorpay/protocol/openid-connect/token
  client-id: ${TRESORPAY_CLIENT_ID:api-mali}
  client-secret: ${TRESORPAY_CLIENT_SECRET:}
  code-client: APP-API-MALI
  code-structure: API-MALI
  callback-url: ${BACKEND_URL:http://localhost:8080}/api/v1/payments/tresorpay/callback
  redirect-url: ${FRONTEND_URL:http://localhost:3001}/dossier
  # Numéro de test pour l'environnement de développement
  # IMPORTANT: Remplacer par un vrai numéro de test fourni par TresorPay
  # Ce numéro sera utilisé automatiquement quand un numéro invalide est détecté en dev
  # test-phone: +22370000000

# Configuration Stripe (conservée pour référence mais non utilisée)
stripe:
  public-key: ${STRIPE_PUBLIC_KEY:}
  secret-key: ${STRIPE_SECRET_KEY:}
  currency: xof
  fees:
    business-creation: 2500000
    document-processing: 500000
    expedited-processing: 1000000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Configuration Orange Money (Ancienne version - conservée pour compatibilité)
orange-money:
  client:
    id: ${ORANGE_MONEY_CLIENT_ID:}
    secret: ${ORANGE_MONEY_CLIENT_SECRET:}
  merchant:
    key: ${ORANGE_MONEY_MERCHANT_KEY:}
  api:
    base-url: https://api.orange.com
    auth-url: ${orange-money.api.base-url}/oauth/v3/token
    webpay-url: ${orange-money.api.base-url}/orange-money-webpay/dev/v1/webpayment
  urls:
    return-url: ${FRONTEND_URL:http://localhost:3000}/payment/success
    cancel-url: ${FRONTEND_URL:http://localhost:3000}/payment/cancel
    notif-url: ${BACKEND_URL:http://localhost:8080}/api/v1/orange-money/callback
  # Configuration V2 (Nouvelle implémentation basée sur les tests Postman)
  v2:
    client:
      id: ${ORANGE_MONEY_CLIENT_ID:}
      secret: ${ORANGE_MONEY_CLIENT_SECRET:}
    merchant:
      key: ${ORANGE_MONEY_MERCHANT_KEY:}
    api:
      oauth-url: https://api.orange.com/oauth/v3/token
      webpay-url: https://api.orange.com/orange-money-webpay/dev/v1/webpayment
    urls:
      return-url: https://investmali.abdatytch.com/return
      cancel-url: https://investmali.abdatytch.com/cancel
      notif-url: https://investmali.abdatytch.com/notif

