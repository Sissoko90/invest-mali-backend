<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Interface utilisateur - Messages et conversations avec vos agents InvestMali" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Tailwind CSS CDN pour un déploiement rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <title>Mes Messages - InvestMali</title>
    
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #ffffff30;
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    
    <!-- Écran de chargement -->
    <div id="loading" class="loading">
      <div class="text-center">
        <div class="spinner mx-auto mb-4"></div>
        <h2 class="text-xl font-semibold">Chargement de vos messages...</h2>
        <p class="text-sm opacity-75 mt-2">Interface utilisateur InvestMali</p>
      </div>
    </div>
    
    <!-- Conteneur principal de l'application -->
    <div id="root"></div>
    
    <script>
      // Masquer l'écran de chargement une fois l'app chargée
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loading = document.getElementById('loading');
          if (loading) {
            loading.style.display = 'none';
          }
        }, 1000);
      });
    </script>
  </body>
</html>
