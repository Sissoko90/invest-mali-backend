# ======= FRONTEND + PROXY API =======
server {
    server_name investmali-agent.abdatytch.com;

    # --- SSL configuration (Certbot) ---
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate /etc/letsencrypt/live/investmali-agent.abdatytch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/investmali-agent.abdatytch.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- ACME for renewal ---
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # --- FRONTEND build (React / Vue / Angular) ---
    root /var/www/frontend/api_agent/build;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API PROXY (CORRIGÉ) ---
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080/api/v1/;  # ✅ CORRIGÉ : ajout de /api/v1/
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;

        #  --- CORS HEADERS pour le frontend ---
        add_header 'Access-Control-Allow-Origin' 'https://investmali-agent.abdatytch.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }
    }
}

# ======= REDIRECT HTTP -> HTTPS =======
server {
    listen 80;
    listen [::]:80;
    server_name investmali-agent.abdatytch.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}
